services:

  # ── Qdrant vector database ────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.13.6  # TODO: upgrade to v1.19.0 once current index is stable
    container_name: promptbridge_qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - ../rag_data_collection/data/qdrant_db:/qdrant/storage

    networks:
      - monitoring

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s


  # ── PromptBridge FastAPI application ──────────────────────────────────────
  promptbridge:
    build:
      context: ..
      dockerfile: rag_service/Dockerfile

    container_name: promptbridge_api

    ports:
      - "8080:8080"

    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      CORS_ORIGINS: ${CORS_ORIGINS:-*}

      PROMPTBRIDGE_DATA_DIR: /app/rag_data_collection/data

      QDRANT_URL: http://qdrant:6333

    volumes:
      # PromptBridge application
      - ../rag_service:/app

      # Entire RAG data collection project
      - ../rag_data_collection:/app/rag_data_collection

    networks:
      - monitoring

    depends_on:
      redis:
        condition: service_started

      qdrant:
        condition: service_healthy

    restart: unless-stopped


  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: promptbridge_redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command:
      - redis-server
      - --appendonly
      - "yes"

    networks:
      - monitoring

    restart: unless-stopped


  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: promptbridge_prometheus

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "9090:9090"

    networks:
      - monitoring

    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"


  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: promptbridge_grafana

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: promptbridge
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    networks:
      - monitoring

    depends_on:
      - prometheus

    restart: unless-stopped


# ── Network ─────────────────────────────────────────────────────────────────
networks:
  monitoring:
    driver: bridge


# ── Persistent volumes ──────────────────────────────────────────────────────
volumes:
  grafana_data:
  redis_data: